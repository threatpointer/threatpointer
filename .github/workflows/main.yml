name: Latest Blog Posts

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:     # Allows manual triggering

jobs:
  fetch-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Fetch latest blog posts
        run: |
          retries=5
          delay=5
          for i in $(seq 1 $retries); do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://mdtanveer.com/rss.xml)
            if [ $response -eq 200 ]; then
              echo "Request succeeded"
              # Add your code to handle the RSS feed here
              break
            elif [ $response -eq 429 ]; then
              echo "Rate limited. Retrying in $delay seconds..."
              sleep $delay
              delay=$((delay * 2))
            else
              echo "Request failed with status $response"
              exit 1
            fi
          done
          if [ $retries -eq 5 ]; then
            echo "Failed to fetch the RSS feed after $retries attempts."
            exit 1
          fi
